name: Update Zapret List

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

# Включаем поддержку Node 24 для чистых логов
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      # Обновили версию до v5, чтобы убрать предупреждение
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download fresh domains list
        run: |
          curl -sSL "https://p.thenewone.lol/domains-export.txt" -o domains-export.txt
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains-export.txt
          git pull --rebase origin main
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update domains list" && git push)
